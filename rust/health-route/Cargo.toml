[package]
name = "fredy-health-route"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
description = "Dormant executable parity implementation of Fredy's health route"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "fredy-health-route"
path = "src/main.rs"

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
strip = true
