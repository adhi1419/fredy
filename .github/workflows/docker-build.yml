name: Build and publish Docker image

# Reusable build shared by both release channels, so they cannot drift apart:
#   docker.yml      -> ghcr.io/orangecoding/fredy             (master + release tags)
#   pre-release.yml -> ghcr.io/orangecoding/fredy-pre-release (develop + *-pre.* tags)

on:
  workflow_call:
    inputs:
      image_name:
        description: 'Image repository without the registry, e.g. orangecoding/fredy'
        required: true
        type: string
      tags:
        description: 'tags input passed through to docker/metadata-action'
        required: true
        type: string

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: linux/amd64,linux/arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ inputs.image_name }}
          tags: ${{ inputs.tags }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test published image with docker compose
        run: |
          IMAGE=$(printf '%s\n' '${{ steps.meta.outputs.tags }}' | head -n 1)
          mkdir -p ./conf
          FREDY_IMAGE="$IMAGE" docker compose up --no-build -d

          for i in $(seq 1 30); do
            CONTAINER_STATUS=$(docker inspect --format='{{.State.Status}}' fredy 2>/dev/null || echo "not_found")
            HEALTH_STATUS=$(docker inspect --format='{{.State.Health.Status}}' fredy 2>/dev/null || echo "not_found")
            echo "[$i/30] Container: $CONTAINER_STATUS, Health: $HEALTH_STATUS"
            if [ "$HEALTH_STATUS" = "healthy" ]; then
              FREDY_IMAGE="$IMAGE" docker compose down
              exit 0
            fi
            if [ "$CONTAINER_STATUS" != "running" ] || [ "$HEALTH_STATUS" = "unhealthy" ]; then
              FREDY_IMAGE="$IMAGE" docker compose logs fredy
              FREDY_IMAGE="$IMAGE" docker compose down
              exit 1
            fi
            sleep 5
          done

          FREDY_IMAGE="$IMAGE" docker compose logs fredy
          FREDY_IMAGE="$IMAGE" docker compose down
          exit 1
