name: Create and publish Docker image

on:
  workflow_dispatch:
  push:
    # Stable images are published only for explicit release tags. Cloud Run has
    # its own single cached build, so every master push must not build twice.
    tags:
      - '*'
      - '!*-pre.*'

jobs:
  docker:
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker-build.yml
    with:
      image_name: ${{ github.repository }}
      tags: |
        type=ref,event=branch
        type=ref,event=tag
        type=raw,value=latest,enable={{is_default_branch}}
