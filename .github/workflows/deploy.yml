name: Deploy to Cloud Run

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OIDC token for Workload Identity Federation

concurrency:
  group: deploy
  cancel-in-progress: false

# Cost-optimized by design: the standalone Test workflow is the single test
# execution. This workflow deploys immediately and intentionally does not repeat
# that suite; the repository owner accepts the higher deployment-failure risk.
jobs:
  deploy:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SA_EMAIL }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Validate Firebase web config
        run: |
          test -n "$FIREBASE_WEB_CONFIG"
          printf '%s' "$FIREBASE_WEB_CONFIG" | jq -e '.projectId and .appId and .apiKey' > /dev/null
        env:
          FIREBASE_WEB_CONFIG: ${{ vars.FIREBASE_WEB_CONFIG }}

      - name: Materialize firebase web config
        run: printf '%s' "$FIREBASE_WEB_CONFIG" > firebase-web-config.json
        env:
          FIREBASE_WEB_CONFIG: ${{ vars.FIREBASE_WEB_CONFIG }}

      - name: Deploy
        run: ./scripts/deploy-cloud-run.sh "${{ vars.GCP_PROJECT_ID }}" "${{ vars.GCP_REGION }}"
