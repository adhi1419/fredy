name: Deploy to Cloud Run

on:
  push:
    branches: [firestore-migration]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OIDC token for Workload Identity Federation

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn
      - run: yarn install --frozen-lockfile

      - name: Start Firestore emulator
        run: |
          docker run -d --name firestore-emulator -p 127.0.0.1:8144:8144 \
            gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators \
            gcloud emulators firestore start --host-port=0.0.0.0:8144
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8144/ > /dev/null && break || sleep 2
          done

      - name: Offline test suite
        run: npx x-var TEST_MODE=offline vitest run --config vitest.gh.config.js

      - name: Contract suite (sqlite)
        run: yarn test:contract

      - name: Contract suite (firestore)
        env:
          STORAGE_BACKEND: firestore
          FIRESTORE_EMULATOR_HOST: 127.0.0.1:8144
        run: yarn test:contract

  deploy:
    needs: test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SA_EMAIL }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Materialize firebase web config
        run: printf '%s' "$FIREBASE_WEB_CONFIG" > firebase-web-config.json
        env:
          FIREBASE_WEB_CONFIG: ${{ vars.FIREBASE_WEB_CONFIG }}

      - name: Deploy
        run: ./scripts/deploy-cloud-run.sh "${{ vars.GCP_PROJECT_ID }}" "${{ vars.GCP_REGION }}"
