name: Deploy to Cloud Run

on:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'index.js'
      - 'Dockerfile'
      - 'package.json'
      - 'yarn.lock'
      - '.github/workflows/deploy.yml'
      - '.github/workflows/pr.yml'
      - 'scripts/backend-image-key.sh'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  packages: read

concurrency:
  group: deploy
  cancel-in-progress: false

# Pull requests publish a runnable image tagged by the exact Docker-input hash.
# Main promotes that validated image without rebuilding. A cache-backed build is
# retained for manual dispatches and any commit that has no matching candidate.
jobs:
  deploy:
    runs-on: ubuntu-24.04
    env:
      IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/fredy/fredy:${{ github.sha }}
      CACHE_REF: ghcr.io/${{ github.repository }}:buildcache
    steps:
      - uses: actions/checkout@v5

      - name: Calculate backend image key
        id: context
        run: echo "hash=$(./scripts/backend-image-key.sh)" >> "$GITHUB_OUTPUT"

      - name: Authenticate to GCP
        id: auth
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SA_EMAIL }}
          token_format: access_token

      - name: Log in to Artifact Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ vars.GCP_REGION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      - name: Promote validated PR image
        id: promote
        env:
          CANDIDATE_REF: ghcr.io/${{ github.repository }}:candidate-${{ steps.context.outputs.hash }}
        run: |
          if docker buildx imagetools inspect "$CANDIDATE_REF" > /dev/null 2>&1 \
            && docker buildx imagetools create --tag "$IMAGE" "$CANDIDATE_REF"; then
            echo "promoted=true" >> "$GITHUB_OUTPUT"
          else
            echo "No promotable image for this exact backend context; using cached build."
            echo "promoted=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push immutable image fallback
        if: steps.promote.outputs.promoted != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}
          cache-from: type=registry,ref=${{ env.CACHE_REF }}

      - name: Deploy image
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          service: fredy
          region: ${{ vars.GCP_REGION }}
          image: ${{ env.IMAGE }}

      - name: Verify health
        env:
          SERVICE_URL: ${{ steps.deploy.outputs.url }}
        run: curl --fail --silent --show-error --retry 3 --retry-delay 2 "$SERVICE_URL/health"

      - name: Publish deployment URL
        env:
          SERVICE_URL: ${{ steps.deploy.outputs.url }}
        run: printf '### Deployed\n%s\n' "$SERVICE_URL" >> "$GITHUB_STEP_SUMMARY"
