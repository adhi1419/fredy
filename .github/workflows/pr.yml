name: Pull Request

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pull-request-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-24.04
    outputs:
      frontend: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.frontend }}
      backend: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.backend }}
      rust: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.rust }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        if: github.event_name == 'pull_request'
        id: filter
        with:
          filters: |
            frontend:
              - 'ui/**'
              - 'test/ui/**'
              - 'index.html'
              - 'vite.config.js'
              - 'package.json'
              - 'yarn.lock'
              - 'bun.lock'
              - '.bun-version'
              - 'bunfig.toml'
              - 'tsconfig.frontend.json'
              - 'scripts/check-lockfiles.js'
              - 'test/toolchainFoundation.test.js'
              - '.github/workflows/pr.yml'
            backend:
              - 'lib/**'
              - 'test/**'
              - '!test/ui/**'
              - 'index.js'
              - 'Dockerfile'
              - 'docker-compose.yml'
              - 'docker-test.sh'
              - 'cloudbuild.yaml'
              - 'scripts/**'
              - 'package.json'
              - 'yarn.lock'
              - '.github/workflows/pr.yml'
            rust:
              - 'rust/**'

  frontend:
    name: Check the source code
    needs: changes
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Check lock policy
        run: bun run check:lockfiles
      - name: Frontend typecheck
        run: bun run typecheck:frontend
      - name: Foundation tests
        run: bun run test:foundation
      - name: Check formatting
        run: bun run format:check
      - name: Lint
        run: bun run lint
      - name: Frontend tests
        if: needs.changes.outputs.frontend == 'true'
        run: bun run test:frontend
      - name: Pages production build
        if: needs.changes.outputs.frontend == 'true'
        run: bun run build:frontend
        env:
          VITE_PAGES: 'true'
          VITE_API_BASE_URL: https://api.example.invalid

  backend-tests:
    name: Backend tests
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --frozen-lockfile --ignore-scripts
      - name: Backend offline tests
        run: npx vitest run --exclude 'test/ui/**'
        env:
          TEST_MODE: offline

  backend-image:
    name: Backend image build
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      CACHE_REF: ghcr.io/${{ github.repository }}:buildcache
    steps:
      - uses: actions/checkout@v5
      - name: Calculate backend image key
        id: context
        run: echo "hash=$(./scripts/backend-image-key.sh)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR for shared cache
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
          tags: ghcr.io/${{ github.repository }}:candidate-${{ steps.context.outputs.hash }}
          cache-from: type=registry,ref=${{ env.CACHE_REF }}
          cache-to: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && format('type=registry,ref={0},mode=min', env.CACHE_REF) || '' }}

  rust-tests:
    name: Rust health route
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.85.1 --profile minimal --component rustfmt --component clippy --no-self-update
      - name: Validate Rust health route
        working-directory: rust/health-route
        run: |
          cargo fmt --check
          cargo check --locked
          cargo test --locked
          cargo clippy --locked --all-targets -- -D warnings

  gate:
    name: PR Gate
    if: always()
    needs: [changes, frontend, backend-tests, backend-image, rust-tests]
    runs-on: ubuntu-24.04
    env:
      CHANGES_RESULT: ${{ needs.changes.result }}
      FRONTEND_RESULT: ${{ needs.frontend.result }}
      BACKEND_TESTS_RESULT: ${{ needs.backend-tests.result }}
      BACKEND_IMAGE_RESULT: ${{ needs.backend-image.result }}
      RUST_RESULT: ${{ needs.rust-tests.result }}
    steps:
      - name: Require applicable checks
        run: |
          echo "changes=$CHANGES_RESULT frontend=$FRONTEND_RESULT backend_tests=$BACKEND_TESTS_RESULT backend_image=$BACKEND_IMAGE_RESULT rust=$RUST_RESULT"
          test "$CHANGES_RESULT" = success
          case "$FRONTEND_RESULT" in success|skipped) ;; *) exit 1 ;; esac
          case "$BACKEND_TESTS_RESULT" in success|skipped) ;; *) exit 1 ;; esac
          case "$BACKEND_IMAGE_RESULT" in success|skipped) ;; *) exit 1 ;; esac
          case "$RUST_RESULT" in success|skipped) ;; *) exit 1 ;; esac
