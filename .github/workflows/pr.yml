name: Pull Request

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pull-request-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-24.04
    outputs:
      frontend: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.frontend }}
      backend: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        if: github.event_name == 'pull_request'
        id: filter
        with:
          filters: |
            frontend:
              - 'ui/**'
              - 'test/ui/**'
              - 'index.html'
              - 'vite.config.js'
              - 'package.json'
              - 'yarn.lock'
              - '.github/workflows/pr.yml'
            backend:
              - 'lib/**'
              - 'test/**'
              - '!test/ui/**'
              - 'index.js'
              - 'Dockerfile'
              - 'docker-compose.yml'
              - 'docker-test.sh'
              - 'cloudbuild.yaml'
              - 'scripts/**'
              - 'package.json'
              - 'yarn.lock'
              - '.github/workflows/pr.yml'

  frontend:
    name: Check the source code
    needs: changes
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --frozen-lockfile --ignore-scripts
      - name: Check formatting
        run: yarn format:check
      - name: Lint
        run: yarn lint
      - name: Frontend tests
        if: needs.changes.outputs.frontend == 'true'
        run: npx vitest run test/ui
        env:
          TEST_MODE: offline
      - name: Pages production build
        if: needs.changes.outputs.frontend == 'true'
        run: yarn build:frontend
        env:
          VITE_PAGES: 'true'
          VITE_API_BASE_URL: https://api.example.invalid

  backend-tests:
    name: Backend tests
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --frozen-lockfile --ignore-scripts
      - name: Backend offline tests
        run: npx vitest run --exclude 'test/ui/**'
        env:
          TEST_MODE: offline

  backend-image:
    name: Backend image build
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      CACHE_REF: ghcr.io/${{ github.repository }}:buildcache
    steps:
      - uses: actions/checkout@v5
      - name: Calculate backend image key
        id: context
        run: echo "hash=$(./scripts/backend-image-key.sh)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR for shared cache
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
          tags: ghcr.io/${{ github.repository }}:candidate-${{ steps.context.outputs.hash }}
          cache-from: type=registry,ref=${{ env.CACHE_REF }}
          cache-to: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && format('type=registry,ref={0},mode=min', env.CACHE_REF) || '' }}

  gate:
    name: PR Gate
    if: always()
    needs: [changes, frontend, backend-tests, backend-image]
    runs-on: ubuntu-24.04
    env:
      CHANGES_RESULT: ${{ needs.changes.result }}
      FRONTEND_RESULT: ${{ needs.frontend.result }}
      BACKEND_TESTS_RESULT: ${{ needs.backend-tests.result }}
      BACKEND_IMAGE_RESULT: ${{ needs.backend-image.result }}
    steps:
      - name: Require applicable checks
        run: |
          echo "changes=$CHANGES_RESULT frontend=$FRONTEND_RESULT backend_tests=$BACKEND_TESTS_RESULT backend_image=$BACKEND_IMAGE_RESULT"
          test "$CHANGES_RESULT" = success
          case "$FRONTEND_RESULT" in success|skipped) ;; *) exit 1 ;; esac
          case "$BACKEND_TESTS_RESULT" in success|skipped) ;; *) exit 1 ;; esac
          case "$BACKEND_IMAGE_RESULT" in success|skipped) ;; *) exit 1 ;; esac
