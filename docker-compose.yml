# Local development only. Emulator data is disposable when its container is removed.
services:
  firestore-emulator:
    container_name: fredy-firestore-emulator
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators
    command:
      - gcloud
      - emulators
      - firestore
      - start
      - --host-port=0.0.0.0:8080
    ports:
      - "127.0.0.1:8144:8080"
    healthcheck:
      test: ['CMD-SHELL', "curl --fail --silent --output /dev/null 'http://127.0.0.1:8080/'"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  fredy:
    container_name: fredy
    build:
      context: .
      dockerfile: Dockerfile
    image: ${FREDY_IMAGE:-ghcr.io/orangecoding/fredy}
    environment:
      - NODE_ENV=development
      - FIRESTORE_EMULATOR_HOST=firestore-emulator:8080
      - FIRESTORE_PROJECT_ID=fredy-compose
    volumes:
      - ./conf:/conf
    depends_on:
      firestore-emulator:
        condition: service_healthy
    ports:
      - "9998:9998"
    restart: unless-stopped
    # Resource limits to prevent runaway memory usage from Chromium
    deploy:
      resources:
        limits:
          memory: 1G
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--max-time", "5", "http://localhost:9998/"]
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 30s
